<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="options.title">Twitch Chat X-Ray — settings</title>
    <link rel="stylesheet" href="options.css">
  </head><body><main>
    <header><img src="icons/icon48.png" alt="" width="40" height="40"><h1>Chat X-Ray</h1></header>
    <nav><a href="#settings" data-i18n="options.heading"></a><a href="#help" data-i18n="options.help"></a></nav>
    <div id="settings">
<section><h2 data-i18n="options.filters"></h2>
<label class="row"><span data-i18n="options.badge"></span><input type="checkbox" data-opt-setting="showBadges"></label>
<label class="row"><span data-i18n="options.thresholdLabel"></span><span class="range"><input type="range" min="10" max="100" step="5" data-opt-setting="suspiciousThreshold"><output id="threshold-output">30/100</output></span></label>
<label class="row"><span data-i18n="options.action"></span><select data-opt-setting="suspectAction"><option value="keep" data-i18n="options.keep"></option><option value="mute" data-i18n="settings.r9kMute"></option><option value="hide" data-i18n="settings.r9kHide"></option></select></label></section>
<section><h2 data-i18n="options.repeats"></h2>
<label class="row"><span data-i18n="settings.r9k"></span><input type="checkbox" data-opt-setting="clientR9K"></label>
<label class="row"><span data-i18n="settings.r9kAction"></span><select data-opt-setting="r9kAction"><option value="mute" data-i18n="settings.r9kMute"></option><option value="hide" data-i18n="settings.r9kHide"></option></select></label></section>
<section><h2 data-i18n="options.stats"></h2>
<label class="row"><span data-i18n="settings.showChatStats"></span><input type="checkbox" data-opt-setting="showChatStats"></label>
<label class="row"><span data-i18n="options.estimate"></span><input type="checkbox" data-opt-setting="adjustViewerCounter"></label></section>
<section><h2 data-i18n="options.data"></h2>
<label class="row"><span data-i18n="settings.accountAge"></span><input type="checkbox" data-opt-setting="accountAgeLookup"></label>
<label class="row"><span data-i18n="settings.audit"></span><input type="checkbox" data-opt-setting="enableAuditLog"></label>
<label class="row"><span data-i18n="settings.recordSession"></span><input type="checkbox" data-opt-setting="recordSession"></label>
<p data-i18n="options.exportHint"></p>
<label class="row"><span data-i18n="settings.language"></span><select data-opt-setting="language"><option value="" data-i18n="settings.languageAuto"></option><option value="ru" data-i18n="settings.languageRu"></option><option value="en" data-i18n="settings.languageEn"></option></select></label>
<button type="button" id="clear-history" data-i18n="settings.clearHistory"></button></section>
    <footer><button id="reset-settings" data-i18n="app.reset"></button><span id="save-state" role="status"></span></footer></div>
    <div id="help" hidden>
<section><h2 data-i18n="options.cardScore.title"></h2>
<p data-i18n="options.scoreHelp"></p>
<details><summary data-i18n="options.weights"></summary><p data-i18n="options.cardScore.body"></p></details></section>
<section><h2 data-i18n="options.cardR9k.title"></h2>
<p data-i18n="options.repeatHelp"></p></section>
<section><h2 data-i18n="options.cardViewers.title"></h2>
<p data-i18n="options.estimateHelp"></p></section>
    </div></main><script src="options.js"></script></body></html>
